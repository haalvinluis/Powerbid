version: '3.8'

services:
  powerbid-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGIN=*
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=powerbid_prod
      - DB_USER=powerbid_user
      - DB_PASSWORD=CHANGE_ME_IN_PRODUCTION
      - JWT_SECRET=CHANGE_ME_JWT_SECRET_32_BYTES_MIN
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=powerbid_prod
      - POSTGRES_USER=powerbid_user
      - POSTGRES_PASSWORD=CHANGE_ME_IN_PRODUCTION
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powerbid_user -d powerbid_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
